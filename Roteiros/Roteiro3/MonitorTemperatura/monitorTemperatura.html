<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel de Temperaturas Semanais</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Monitor de Temperaturas Semanais</h2>

  <label for="temperatura">Digite a temperatura (°C):</label><br>
  <input type="number" id="temperatura" step="0.1">
  <button onclick="adicionarTemperatura()">Adicionar Temperatura</button><br>

  <h3>Temperaturas Inseridas:</h3>
  <ul id="listaTemperaturas"></ul>

  <button onclick="calcularMedia()">Calcular Média</button>
  <button onclick="calcularMediaMovel()">Calcular Média Movel (3 dias)</button>
  <button onclick="analisarTendencia()">Analisar Tendência (7 dias)</button>
  <button onclick="alertaTemperaturaExtema()">Alerta de Temperatura Extrema</button>

  <div id="resultado"></div>

  <script>
    const temperaturas = [];

    function adicionarTemperatura() {
      const input = document.getElementById('temperatura');
      const valor = parseFloat(input.value);

      if (isNaN(valor)) {
        alert("Por favor, insira um número válido.");
        return;
      }

      temperaturas.push(valor);

      const lista = document.getElementById('listaTemperaturas');
      const item = document.createElement('li');
      item.textContent = valor + " °C";
      lista.appendChild(item);

      input.value = "";
      input.focus();
    }

    function calcularMedia() {
      if (temperaturas.length === 0) {
        alert("Nenhuma temperatura foi inserida.");
        return;
      }

      //Questão 01 -TODO
      let lista = document.getElementById("listaTemperaturas");
      let soma = 0;

      for (let i = 0; i< lista.children.length; i++) {
        soma += parseFloat(lista.children[i].textContent);
      }

      let media = soma / lista.children.length

      let mensagem;
      if (media > 30) {
        mensagem = "A semana está quente! 🔥";
      } else if (media >= 20 && media <= 30) {
        mensagem = "Temperatura amena. 🌤️";
      } else {
        mensagem = "Semana fria! ❄️";
      }

      const resultado = document.getElementById('resultado');
      resultado.innerHTML = `
        <p>Média das temperaturas: <strong>${media.toFixed(2)} °C</strong></p>
        <div class="alerta">${mensagem}</div>
      `;
    }

    function calcularMediaMovel() {  
      if(temperaturas.length < 3) {
        alert("É necessárrio pelo menos 3 temperaturas")
        return
      }

      let mediasMoveis = [];
      let resultadoHTML = "<h3>Médias Móveis (3 dias):</h3><ul>";

      for (let i = 0; i <= temperaturas.length - 3; i++) {
        const soma = temperaturas[i] + temperaturas[i + 1] + temperaturas[i + 2];
        const media = soma / 3;

        mediasMoveis.push(media);
        resultadoHTML += `<li>Dias ${i + 1}-${i + 3}: ${media.toFixed(2)} °C</li>`;
      }

      resultadoHTML += "</ul>";

      const mediaDasMedias = mediasMoveis.reduce((a, b) => a + b, 0) / mediasMoveis.length;

      document.getElementById('resultado').innerHTML = resultadoHTML;
        
    }

    function analisarTendencia() {
      if(temperaturas.length < 7) {
        alert("É necessário pelo menos 7 temperaturas para analisar a tendência");
        return;
      }

      const itensTemperatura = document.querySelectorAll('#listaTemperaturas li');
      const ultimos7Itens = Array.from(itensTemperatura).slice(-7);

      // Converter o textContent de cada item para float
      const ultimos7Dias = ultimos7Itens.map(item => {
          // Remove "°C" e converte para float
          return parseFloat(item.textContent.replace('°C', ''));
      });

      // Fiz uso de regressão linear para calcular a tendência das temperaturas

      let somaX, somaY, somaXY, somaX2;
      somaX = somaY = somaXY = somaX2 = 0;

      for(let i = 0; i < 7; i++) {
        somaX += i
        somaY += ultimos7Dias[i]
        somaXY += i * ultimos7Dias[i]
        somaX2 += i * i;
      }

      // Calcular a inclinação da reta
      /*
        inclinacao = n⋅(∑xy) − (∑x)⋅(∑y) / n⋅∑(x²) − (∑x)²​

        n->número de dias(7)
        x->índice do dia(0 a 6)
        y->temperatura no dia x
        ∑->somátorio

      */
      const inclinacao = (7 * somaXY - somaX * somaY) / (7 * somaX2 - somaX * somaX);
      
      const variacao = ultimos7Dias[6] - ultimos7Dias[0]

      if(inclinacao > 0.1) {
        alert("Tendência a Aquecimento");

      }else if (inclinacao < -0.1) {
        alert("Tendência a Resfriamento");

      }else {
        alert("Sem padrão claro");

      }

    }

  </script>

</body>
</html>
