<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        const calcularEstatisticas = () => {
            
            let listaInput = document.getElementById("lista").value;
            listaInput = listaInput.split(',').map(Number);

            //Calcular a média
            let soma = listaInput.reduce((acc, value) => acc + value, 0);
            let mediaAritmetica = soma / listaInput.length;

            // calcular quantos positivos e negativos tem na lista de entrada
            let positivos = 0;
            let negativos = 0;

            listaInput.forEach(element => {
                if(element > 0) positivos++;
                else if (element < 0) negativos++;  
            });

            // calcular percentual de positivos e negativos
            let percentualPositivos = (positivos / listaInput.length) * 100;
            let percentualNegativos = (negativos / listaInput.length) * 100;

            const saida = `
                <p>Média aritmética: ${mediaAritmetica.toFixed(2)}</p>
                <p>Quantidade de positivos: ${positivos}</p>
                <p>Quantidade de negativos: ${negativos}</p>
                <p>Percentual de positivos: ${percentualPositivos.toFixed(2)}%</p>
                <p>Percentual de negativos: ${percentualNegativos.toFixed(2)}%</p>
            `

            document.getElementById("saida").innerHTML = saida
        }
        
    
    </script>
</head>
<body>
    Lista: <input type="text" id="lista">
    <input type="button" value="calcular Fatorial" onclick="calcularEstatisticas()">
    <br />
    <div id="saida"></div>
    

</body>
</html>
